services:
  postgres:
    image: postgres:17
    container_name: part13-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bloglist
      POSTGRES_USER: bloglist
      POSTGRES_PASSWORD: bloglist_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloglist -d bloglist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
